  type: filteredTrace
  params: ""
  num_req: -1
  sample_ratio: 1.0

global:
  report_interval: 25165824
  queue_depth: 4194304
  ignore_obj_size: false
  consider_obj_metadata: false
  verbose: true
  print_head_req: true

output:
  path: /memory_traces/icparsa1/inmemory-analytics/analysis/lru-evicted-trace-generation/cachesim_results.txt

logging:
  dir: /memory_traces/icparsa1/inmemory-analytics/analysis/lru-evicted-trace-generation
  level: INFO
  streams: ALL

configurations:

  # 30% of 5244325 bytes = 1573K
  - policy: LRU
